name = "ai-router"
main = "src/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Copy this file to wrangler.toml for local deployment.
# Store real dashboard passwords and API secrets using Cloudflare secrets or local ignored config.
[vars]
DASHBOARD_PASSWORD = "change-me"

[[d1_databases]]
binding = "DB"
database_name = "ai-router-db"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"
